name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate root config files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "package.json valid"
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json','utf8'))" && echo "tsconfig.json valid"
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.base.json','utf8'))" && echo "tsconfig.base.json valid"

      - name: Validate GitHub App manifest
        run: |
          grep -q "name:" .github/app.yml && echo "app.yml valid" || (echo "app.yml missing name field" && exit 1)

      - name: Check workspace structure
        run: |
          [ -f "pnpm-workspace.yaml" ] && echo "pnpm-workspace.yaml present" || (echo "pnpm-workspace.yaml missing" && exit 1)
          [ -f ".github/CODEOWNERS" ] && echo "CODEOWNERS present" || (echo "CODEOWNERS missing" && exit 1)
          [ -f ".github/profile/README.md" ] && echo "org profile README present" || (echo "org profile README missing" && exit 1)

      - name: Check for forbidden platform references
        run: |
          if grep -rI "@replit\|REPL_ID\|REPLIT_DOMAINS\|REPLIT_DEV_DOMAIN" \
            --include="*.ts" --include="*.js" --include="*.json" --include="*.yaml" \
            --exclude-dir=".github" . 2>/dev/null; then
            echo "Forbidden platform references found" && exit 1
          fi
          echo "Clean"
