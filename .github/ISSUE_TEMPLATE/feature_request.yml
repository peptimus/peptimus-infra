name: Feature Request
description: Suggest a new feature or improvement for Peptimus
title: "[feat] "
labels: ["enhancement"]
assignees:
  - peptimusdev
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to improve Peptimus? Fill out the sections below.
  - type: dropdown
    id: repo
    attributes:
      label: Target Repository
      options:
        - peptimus (web app)
        - peptimus-api (API server)
        - peptimus-shared (shared packages)
        - peptimus-infra (monorepo / CI)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve?
      placeholder: I find it frustrating when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe the feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any other approaches you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, mockups, references, or examples.
